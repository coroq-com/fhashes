# 記録する側（監視対象）の設定。config/record.yaml に置く（--config か環境変数 FHASHES_RECORD_CONFIG で変更可）。
# 相対パスは、この設定ファイルのあるディレクトリが基準。

host: web1                  # スナップショットに書くホスト名（必須）。ホストごとに違う名前にする
state_dir: ../data/record   # 状態ファイルと送信待ちのスナップショットを置く場所

# 監視するファイル（ワイルドカード）
#   *  : "/" 以外の 0 文字以上      ?  : "/" 以外の 1 文字      [abc] [!abc] : 文字クラス
#   ** : 0 個以上のディレクトリ（"/**/" や末尾の "/**" のように単独で書く）
# ディレクトリの中身を全部監視するときは "/var/www/app/**" のように書く。
include:
  - /var/www/app/**
  - /etc/nginx/**
  - /etc/php/**

# 除外するもの。除外にマッチしたディレクトリの中には入らない（負荷も減る）。
# アップロード用のディレクトリは丸ごと除外せず、*.php などは監視することを勧める。
# マウントポイント（別のディスク）の中も走査する。/proc・/sys やネットワーク上のディスクなど、入りたくないものはここに書く。
exclude:
  - /var/www/app/cache/**
  - /var/www/app/storage/logs/**

# この回数の実行で、すべてのファイルを一度は中身から読み直す（毎時の実行なら約 24 時間で一巡）。
# それ以外の回は、ctime・サイズ・inode が変わったファイルだけを読み直す
reread_cycle: 24

upload:
  # 送り先（rclone の場所）。この直下に置く。ホストごとに分けるのを勧める。ローカルのパスでもよい。null なら送らない
  # （rclone 1.61 以降のインストールと、送り先の設定は事前に済ませておく。README の「ストレージ」を参照）
  remote: "fhashes-gcs:fhashes-snapshots/web1"
  rclone_config: rclone.conf     # rclone の設定ファイル（相対パスはこの設定ファイルのある場所が基準）。省略すると rclone の既定の場所
  # rclone_options: []           # rclone に渡す追加のオプション（ふつうは不要）
  # rclone: rclone               # rclone のコマンドのパス
